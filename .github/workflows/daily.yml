name: 每日更新半導體板塊輪動

on:
  schedule:
    # 分鐘刻意避開 :00 / :30（GitHub 排程在整點與半點最容易被延遲或整次跳過）
    - cron: "7 0 * * 2-6"
    - cron: "23 1 * * 2-6"
    - cron: "47 2 * * 2-6"
    - cron: "13 5 * * 2-6"
    - cron: "37 9 * * 2-6"→ Runs at 05:30, Tuesday through Saturday

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-rotation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install --quiet pandas numpy

      - name: 產生儀表板
        run: python rotation.py
        env:
          OUT_HTML: index.html
          OUT_JSON: data.json

      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "沒有變化，略過提交"
          else
            git commit -m "更新至 $(date -u +%Y-%m-%d) 收盤資料"
            git push
          fi
