name: 每日更新半導體板塊輪動

on:
  schedule:
    # cron 一律是 UTC，不會跟著美國日光節約時間走。美股收盤：
    #   夏令 EDT 16:00 = 20:00 UTC ／ 冬令 EST 16:00 = 21:00 UTC
    # 所以最早的時段必須晚於 21:00 UTC，否則一到冬令就會在盤中跑，
    # 抓到 Yahoo 當天的未完成 bar，把盤中價當收盤發出去。
    # 分鐘避開 :00 / :30（GitHub 整點負載高，排程容易被丟掉）。
    - cron: "33 21 * * 1-5"   # 台北 05:33｜EST 16:33、EDT 17:33 皆收盤後
    - cron: "19 22 * * 1-5"   # 台北 06:19
    - cron: "7 23 * * 1-5"    # 台北 07:07
    - cron: "41 0 * * 2-6"    # 台北 08:41
    - cron: "13 1 * * 2-6"    # 台北 09:13
    - cron: "47 3 * * 2-6"    # 台北 11:47
    - cron: "29 5 * * 2-6"    # 台北 13:29
    - cron: "41 7 * * 2-6"    # 台北 15:41
    - cron: "19 11 * * 2-6"   # 台北 19:19
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-rotation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install --quiet pandas numpy

      - name: 產生儀表板（資料日沒前進就重試）
        run: |
          OLD=$(python -c "import json;print(json.load(open('data.json'))['asof'])" 2>/dev/null || echo none)
          echo "已發布的資料日：$OLD"
          for i in 1 2 3 4; do
            python rotation.py
            NEW=$(python -c "import json;print(json.load(open('data.json'))['asof'])")
            echo "第 $i 次產生 → $NEW"
            if [ "$NEW" != "$OLD" ]; then
              echo "資料已前進到 $NEW"
              exit 0
            fi
            [ $i -lt 4 ] && { echo "與已發布相同，90 秒後重試"; sleep 90; }
          done
          echo "::warning title=資料未前進::重試 4 次後資料日仍是 $NEW。若今天美股有開盤，代表上游（Yahoo）給這台主機的是舊快照，等下一個排程時段。"
        env:
          OUT_HTML: index.html
          OUT_JSON: data.json

      - name: 提交結果
        run: |
          ASOF=$(python -c "import json;print(json.load(open('data.json'))['asof'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "資料未變（最新交易日 $ASOF 已發布），略過提交"
          else
            git commit -m "更新至 $ASOF 收盤資料"
            git push
          fi
