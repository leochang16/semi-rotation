name: 每日更新半導體板塊輪動

on:
  schedule:
    # GitHub 的 schedule 是 best-effort，會延遲甚至整次跳過。
    # 排三個時段當冗餘：台北 08:30 / 10:30 / 13:30（週二至週六，對應美股週一至週五收盤後）。
    # 資料沒變時輸出檔位元組完全相同，git 判定無變化就不會提交，所以多跑不會產生雜訊。
    - cron: "30 0 * * 2-6"
    - cron: "30 2 * * 2-6"
    - cron: "30 5 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-rotation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install --quiet pandas numpy

      - name: 產生儀表板
        run: python rotation.py
        env:
          OUT_HTML: index.html
          OUT_JSON: data.json

      - name: 提交結果
        run: |
          ASOF=$(python -c "import json;print(json.load(open('data.json'))['asof'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "資料未變（最新交易日 $ASOF 已發布），略過提交"
          else
            git commit -m "更新至 $ASOF 收盤資料"
            git push
          fi
